<svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" data-d-component="svg" fill="currentColor" style="color:rgb(238, 238, 238)" viewBox="0 0 350 580" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Conceptual enterprise data architecture</title><desc>Generic API and ODBC source groups feed ingestion pipelines and Bronze, Silver, and Gold layers in Microsoft Fabric. Pipeline operations include monitoring, logging, and notifications. Downstream consumers illustrate possible uses, not verified deployments.</desc><rect width="350" height="580" fill="#1f1f1f"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8995a3"/></marker></defs><text x="151" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">Enterprise source systems</text><rect x="8" y="29" width="140" height="43" rx="5" fill="#64748b" fill-opacity=".1" stroke="#94a3b8"/><text x="78" y="47" font-size="11" font-weight="600" text-anchor="middle">Enterprise APIs</text><text x="78" y="62" font-size="9" text-anchor="middle">Generic source group</text><path d="M78 72 V86 H151" fill="none" stroke="#8995a3"/><rect x="154" y="29" width="140" height="43" rx="5" fill="#64748b" fill-opacity=".1" stroke="#94a3b8"/><text x="224" y="47" font-size="11" font-weight="600" text-anchor="middle">Database connections</text><text x="224" y="62" font-size="9" text-anchor="middle">ODBC</text><path d="M224 72 V86 H151" fill="none" stroke="#8995a3"/><path d="M151 86 V105" stroke="#8995a3" marker-end="url(#arr)"/><rect x="31" y="107" width="240" height="48" rx="6" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6"/><text x="151" y="127" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">Data ingestion &amp; orchestration</text><text x="151" y="143" font-size="10" text-anchor="middle" fill="currentColor">Enterprise integration pipelines</text><path d="M151 155 V184" stroke="#8995a3" marker-end="url(#arr)"/><rect x="8" y="168" width="285" height="244" rx="9" stroke="#16a34a" fill="#16a34a" fill-opacity=".035" stroke-dasharray="5 3"/><text x="19" y="181" font-size="9" fill="#16a34a" font-weight="600">MICROSOFT FABRIC</text><rect x="31" y="191" width="240" height="44" rx="5" fill="#b77943" fill-opacity=".17" stroke="#b77943"/><text x="151" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Bronze</text><text x="151" y="223" text-anchor="middle" font-size="10" fill="currentColor">Raw source data</text><path d="M151 235 v15" stroke="#8995a3" marker-end="url(#arr)"/><rect x="31" y="251" width="240" height="44" rx="5" fill="#94a3b8" fill-opacity=".17" stroke="#94a3b8"/><text x="151" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Silver</text><text x="151" y="283" text-anchor="middle" font-size="10" fill="currentColor">Cleansed &amp; standardized data</text><path d="M151 295 v15" stroke="#8995a3" marker-end="url(#arr)"/><rect x="31" y="311" width="240" height="44" rx="5" fill="#ca9b24" fill-opacity=".17" stroke="#ca9b24"/><text x="151" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Gold</text><text x="151" y="343" text-anchor="middle" font-size="10" fill="currentColor">Curated business data</text><path d="M151 355 v15" stroke="#8995a3" marker-end="url(#arr)"/><rect x="31" y="371" width="240" height="29" rx="5" fill="#16a34a" fill-opacity=".12" stroke="#16a34a"/><text x="151" y="389" font-size="11" text-anchor="middle" font-weight="600" fill="currentColor">Consumption-ready datasets</text><rect x="306" y="107" width="36" height="305" rx="6" stroke="#8b5cf6" fill="#8b5cf6" fill-opacity=".1"/><text transform="translate(327 260) rotate(-90)" text-anchor="middle" font-size="11" font-weight="500" fill="currentColor">Monitoring · Logging · Automated notifications</text><path d="M271 131 H306" stroke="#8b5cf6" stroke-dasharray="3 3"/><path d="M271 213 H306" stroke="#8b5cf6" stroke-dasharray="3 3"/><path d="M271 273 H306" stroke="#8b5cf6" stroke-dasharray="3 3"/><path d="M271 333 H306" stroke="#8b5cf6" stroke-dasharray="3 3"/><path d="M271 385 H306" stroke="#8b5cf6" stroke-dasharray="3 3"/><path d="M151 412 V437" stroke="#8995a3" marker-end="url(#arr)"/><text x="151" y="454" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">Potential downstream consumers</text><path d="M151 462 V470 H41 M151 470 H261" stroke="#8995a3" fill="none"/><path d="M41 470 V484" stroke="#8995a3" marker-end="url(#arr)"/><rect x="8" y="486" width="67" height="47" rx="5" fill="#3b82f6" fill-opacity=".08" stroke="#94a3b8"/><text x="41.5" y="505" text-anchor="middle" font-size="9.5" font-weight="600" fill="currentColor">Applications</text><text x="41.5" y="520" text-anchor="middle" font-size="9" fill="currentColor">Software</text><path d="M114 470 V484" stroke="#8995a3" marker-end="url(#arr)"/><rect x="81" y="486" width="67" height="47" rx="5" fill="#3b82f6" fill-opacity=".08" stroke="#94a3b8"/><text x="114.5" y="505" text-anchor="middle" font-size="9.5" font-weight="600" fill="currentColor">AI chatbots</text><text x="114.5" y="520" text-anchor="middle" font-size="9" fill="currentColor">Intelligence</text><path d="M187 470 V484" stroke="#8995a3" marker-end="url(#arr)"/><rect x="154" y="486" width="67" height="47" rx="5" fill="#3b82f6" fill-opacity=".08" stroke="#94a3b8"/><text x="187.5" y="505" text-anchor="middle" font-size="9.5" font-weight="600" fill="currentColor">Reporting</text><text x="187.5" y="520" text-anchor="middle" font-size="9" fill="currentColor">Analytics</text><path d="M260 470 V484" stroke="#8995a3" marker-end="url(#arr)"/><rect x="227" y="486" width="67" height="47" rx="5" fill="#3b82f6" fill-opacity=".08" stroke="#94a3b8"/><text x="260.5" y="505" text-anchor="middle" font-size="9.5" font-weight="600" fill="currentColor">Services</text><text x="260.5" y="520" text-anchor="middle" font-size="